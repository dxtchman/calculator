name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build and test
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |FAILED|What went wrong|error:|Exception|expected:" -A2 build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Build failed::$msg"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Calculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Calculator
          path: Calculator.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Calculator build ${{ github.run_number }}
          body: Tap Calculator.apk below to download, then open it to install.
          files: Calculator.apk
          make_latest: true
